[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/solidcraft/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/solidcraft/app/"

[[headers]]
  for = "/solidcraft/app/build.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/solidcraft/app/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
