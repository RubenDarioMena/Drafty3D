# Drafty3D Learn: builds the githack preview on every push, and the APK only when
# started by hand (Actions → Run workflow), from the same compiled files.
# GitHub Actions is free for this public repo; it never triggers a Vercel build
# (the preview branch carries vercel.json with the main-only ignoreCommand).
name: Drafty3D Learn · APK + preview

on:
  push:
    branches: [main, codex/portal-diseno]
    paths:
      - 'learn/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/learn.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app (same files for githack and the APK)
        run: npm run build:learn

      - name: Check the pipeline ↔ UI contract
        run: node --test tests/learn.test.mjs

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: 21

      - run: npx cap sync android
        if: github.event_name == 'workflow_dispatch'

      - name: Signing key from secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.LEARN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEARN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEARN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LEARN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/keystore.properties
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets yet: building a debug APK. Uninstall it before installing the next one."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        run: |
          task=$([ "$VARIANT" = release ] && echo assembleRelease || echo assembleDebug)
          ./gradlew --no-daemon "$task" -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          mkdir -p ../out
          cp "$(find app/build/outputs/apk/$VARIANT -name '*.apk' | head -1)" ../out/drafty3d-learn.apk

      - name: Publish to GitHub Releases (rolling ${{ env.CHANNEL }} release)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="learn-$CHANNEL"
          notes="Drafty3D Learn $CHANNEL build from ${GITHUB_SHA::7} (${{ github.ref_name }}), ${VARIANT} signed. Works offline. Direct download: drafty3d-learn.apk."
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" out/drafty3d-learn.apk --target "$GITHUB_SHA" --prerelease \
            --title "Drafty3D Learn ($CHANNEL)" --notes "$notes"

      - name: Publish the githack preview branch
        if: env.CHANNEL == 'preview'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin preview > /dev/null; then
            git fetch --depth 1 origin preview
            git worktree add -B preview ../preview FETCH_HEAD
          else
            git worktree add --orphan -b preview ../preview
          fi
          cd ../preview
          git rm -rq --ignore-unmatch .
          cp -r "$GITHUB_WORKSPACE/dist/learn" learn
          printf '{\n  "ignoreCommand": "[ \\"$VERCEL_GIT_COMMIT_REF\\" != \\"main\\" ]"\n}\n' > vercel.json
          printf '# Drafty3D Learn preview\n\nGenerated by CI from %s. Do not edit.\n\nOpen https://raw.githack.com/%s/preview/learn/index.html\n' "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" > README.md
          git add -A
          git commit -qm "Drafty3D Learn preview from ${GITHUB_SHA::7}" || { echo "No changes"; exit 0; }
          git push origin preview
